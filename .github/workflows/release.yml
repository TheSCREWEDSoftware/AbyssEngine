# Builds downloadable releases for Windows, Linux and macOS.
#
# - Pushing a tag like "v0.2.0" builds all three and publishes a GitHub release with them attached (as a draft, to
#   look over and publish by hand).
# - Running it by hand (Actions > Release > Run workflow) builds the same downloads as artifacts, without a release.
#
# What's in each download: the engine, abyss-lobby (the online games list server), abyss.ini.dist (copy it to
# abyss.ini and set BasePath to your Diablo II folder), the README and the licence.
#   - Windows: a .zip with the DLLs the engine needs next to it (vcpkg puts them there)
#   - Linux:   a .tar.gz; it uses the distribution's SDL2, FFmpeg and libarchive (the README says which packages)
#   - macOS:   a .zip of AbyssEngine.app with its Homebrew libraries copied in (dylibbundler), so it runs on its own
name: Release

on:
    push:
        tags: [ "v*" ]
    workflow_dispatch:

permissions:
    contents: write # to make the release

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    -   name: Windows
                        os: windows-latest
                        triplet: x64-windows
                        package: AbyssEngine-windows-x64.zip
                    -   name: Linux
                        os: ubuntu-22.04 # an older glibc: runs on more distributions
                        package: AbyssEngine-linux-x64.tar.gz
                    -   name: macOS
                        os: macos-latest
                        package: AbyssEngine-macos.zip

        env:
            VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
            VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    submodules: recursive
                    fetch-depth: 0 # the version shown on the main menu comes from git

            -   name: Version
                id: version
                shell: bash
                run: |
                    if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                        echo "text=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
                    else
                        echo "text=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
                    fi

            # Windows: vcpkg builds the dependencies (as in ci.yml)
            -   name: Export GitHub Actions cache environment variables (Windows)
                if: runner.os == 'Windows'
                uses: actions/github-script@v7
                with:
                    script: |
                        core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
                        core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

            -   name: Install tools (Windows)
                if: runner.os == 'Windows'
                run: choco install nasm ninja --no-progress -y

            -   name: Set up vcpkg (Windows)
                if: runner.os == 'Windows'
                uses: lukka/run-vcpkg@v11
                with:
                    vcpkgJsonGlob: "**/vcpkg.json"
                    vcpkgDirectory: "${{ github.workspace }}/vcpkg"
                    vcpkgGitCommitId: "b4a3d89125e45bc8f80fb94bef9761d4f4e14fb9"

            -   name: Configure (Windows)
                if: runner.os == 'Windows'
                run: >
                    cmake
                    -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
                    -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
                    -DCMAKE_C_COMPILER=cl
                    -DCMAKE_CXX_COMPILER=cl
                    -DCMAKE_BUILD_TYPE=Release
                    -DGITHUB_ACTIONS=1
                    -DABYSS_VERSION_TEXT="${{ steps.version.outputs.text }}"
                    -S ${{ github.workspace }}
                    -B ${{ github.workspace }}/build

            -   name: Install dependencies (Linux)
                if: runner.os == 'Linux'
                run: |
                    sudo apt-get update
                    sudo apt-get install -y build-essential cmake ninja-build pkg-config libsdl2-dev zlib1g-dev \
                        libarchive-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev

            -   name: Install dependencies (macOS)
                if: runner.os == 'macOS'
                run: brew install ninja pkg-config sdl2 ffmpeg libarchive dylibbundler

            -   name: Configure (Linux, macOS)
                if: runner.os != 'Windows'
                run: |
                    if [ "$RUNNER_OS" = "macOS" ]; then
                        export CMAKE_PREFIX_PATH="$(brew --prefix libarchive)"
                        export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig:$PKG_CONFIG_PATH"
                    fi
                    cmake -G Ninja \
                        -DCMAKE_BUILD_TYPE=Release \
                        -DGITHUB_ACTIONS=1 \
                        -DABYSS_VERSION_TEXT="${{ steps.version.outputs.text }}" \
                        -S "${{ github.workspace }}" \
                        -B "${{ github.workspace }}/build"

            -   name: Build
                run: cmake --build ${{ github.workspace }}/build --config Release

            # Each download: a folder named after it, zipped (tarred on Linux)
            -   name: Package (Windows)
                if: runner.os == 'Windows'
                shell: pwsh
                run: |
                    $out = "AbyssEngine"
                    New-Item -ItemType Directory -Force -Path $out | Out-Null
                    # (the Visual Studio generator puts the build in Release/, with vcpkg's DLLs)
                    Copy-Item build/Release/AbyssEngine.exe, build/Release/abyss-lobby.exe $out
                    Copy-Item build/Release/*.dll $out
                    Copy-Item content/abyss.ini "$out/abyss.ini.dist"
                    Copy-Item README.md, LICENSE $out
                    Compress-Archive -Path $out -DestinationPath "${{ matrix.package }}"

            -   name: Package (Linux)
                if: runner.os == 'Linux'
                run: |
                    out=AbyssEngine
                    mkdir -p "$out"
                    cp build/AbyssEngine build/abyss-lobby "$out/"
                    cp content/abyss.ini "$out/abyss.ini.dist"
                    cp README.md LICENSE "$out/"
                    strip "$out/AbyssEngine" "$out/abyss-lobby"
                    tar czf "${{ matrix.package }}" "$out"

            -   name: Package (macOS)
                if: runner.os == 'macOS'
                run: |
                    out=AbyssEngine
                    mkdir -p "$out"
                    cp -R build/AbyssEngine.app "$out/"
                    # Homebrew's libraries into the app, so it runs without Homebrew
                    dylibbundler -od -b -x "$out/AbyssEngine.app/Contents/MacOS/AbyssEngine" \
                        -d "$out/AbyssEngine.app/Contents/libs" -p @executable_path/../libs
                    codesign --force --deep --sign - "$out/AbyssEngine.app" # ad hoc: Apple silicon needs a signature
                    cp build/abyss-lobby "$out/"
                    cp content/abyss.ini "$out/abyss.ini.dist"
                    cp README.md LICENSE "$out/"
                    ditto -c -k --keepParent "$out" "${{ matrix.package }}"

            -   name: Upload
                uses: actions/upload-artifact@v4
                with:
                    name: ${{ matrix.package }}
                    path: ${{ matrix.package }}
                    if-no-files-found: error

    release:
        name: Publish
        needs: build
        if: github.ref_type == 'tag'
        runs-on: ubuntu-latest
        steps:
            -   name: Download the builds
                uses: actions/download-artifact@v4
                with:
                    path: downloads
                    merge-multiple: true

            -   name: Make the release (a draft)
                uses: softprops/action-gh-release@v2
                with:
                    draft: true
                    name: Abyss Engine ${{ github.ref_name }}
                    generate_release_notes: true
                    files: downloads/*
