# Builds the engine on Windows, Linux and macOS on every push and pull request to main, and uploads the builds of main
# as "unstable-<OS>" artifacts.
#
# Dependencies (SDL2, FFmpeg, libarchive, zlib):
#   - Windows: vcpkg (vcpkg.json), pinned to the baseline there
#   - Linux:   the distribution's packages (apt). vcpkg's from-source builds broke on new runner images (libxcrypt),
#              and the packages are what people building on Linux use anyway (see the README)
#   - macOS:   Homebrew
name: Continuous Integration

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]
    workflow_dispatch:

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false

            matrix:
                include:
                    -   name: Windows (MSVC)
                        os: windows-latest
                        c_compiler: cl
                        cpp_compiler: cl
                        triplet: x64-windows
                    -   name: Ubuntu (GCC)
                        os: ubuntu-latest
                        c_compiler: gcc
                        cpp_compiler: g++
                    -   name: macOS (Clang)
                        os: macos-latest
                        c_compiler: clang
                        cpp_compiler: clang++

        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    submodules: recursive
                    fetch-depth: 0 # the commit and branch shown on the main menu come from git

            -   name: Set reusable strings
                id: strings
                shell: bash
                run: |
                    echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

            # Windows: vcpkg builds the dependencies; its binary cache uses the GitHub Actions cache
            -   name: Export GitHub Actions cache environment variables (Windows)
                if: runner.os == 'Windows'
                uses: actions/github-script@v7
                with:
                    script: |
                        core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
                        core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

            -   name: Install tools (Windows)
                if: runner.os == 'Windows'
                run: choco install nasm ninja --no-progress -y

            -   name: Set up vcpkg (Windows)
                if: runner.os == 'Windows'
                uses: lukka/run-vcpkg@v11
                with:
                    vcpkgJsonGlob: "**/vcpkg.json"
                    vcpkgDirectory: "${{ github.workspace }}/vcpkg"
                    vcpkgGitCommitId: "b4a3d89125e45bc8f80fb94bef9761d4f4e14fb9"

            -   name: Configure CMake (Windows)
                if: runner.os == 'Windows'
                run: >
                    cmake
                    -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
                    -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
                    -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
                    -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
                    -DCMAKE_BUILD_TYPE=Release
                    -DGITHUB_ACTIONS=1
                    -DABYSS_VERSION_TEXT="${{ github.sha }}"
                    -S ${{ github.workspace }}
                    -B ${{ steps.strings.outputs.build-output-dir }}

            # Linux: the distribution's packages
            -   name: Install dependencies (Linux)
                if: runner.os == 'Linux'
                run: |
                    sudo apt-get update
                    sudo apt-get install -y build-essential cmake ninja-build pkg-config libsdl2-dev zlib1g-dev \
                        libarchive-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev

            # macOS: Homebrew
            -   name: Install dependencies (macOS)
                if: runner.os == 'macOS'
                run: |
                    brew install ninja pkg-config sdl2 ffmpeg libarchive

            -   name: Configure CMake (Linux/macOS)
                if: runner.os != 'Windows'
                run: |
                    # Homebrew's libarchive is keg-only: point CMake at it
                    if [ "$RUNNER_OS" = "macOS" ]; then
                        export CMAKE_PREFIX_PATH="$(brew --prefix libarchive)"
                        export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig:$PKG_CONFIG_PATH"
                    fi
                    cmake -G Ninja \
                        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
                        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
                        -DCMAKE_BUILD_TYPE=Release \
                        -DGITHUB_ACTIONS=1 \
                        -DABYSS_VERSION_TEXT="${{ github.sha }}" \
                        -S "${{ github.workspace }}" \
                        -B "${{ steps.strings.outputs.build-output-dir }}"

            -   name: Build
                run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

            -   name: Upload Artifacts
                if: github.ref == 'refs/heads/main'
                uses: actions/upload-artifact@v4
                with:
                    name: unstable-${{ runner.os }}
                    path: ${{ steps.strings.outputs.build-output-dir }}
                    if-no-files-found: error
                    overwrite: true

        env:
            VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
            VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}
